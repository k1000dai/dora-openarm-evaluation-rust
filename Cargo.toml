[package]
name = "dora-openarm-evaluation-rust"
version = "1.0.0"
authors = ["Enactic, Inc."]
description = "Rust port of the dora-openarm-evaluation orchestration and policy server sidecars"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/k1000dai/dora-openarm-evaluation-rust"
edition = "2024"
rust-version = "1.85"

[lib]
name = "dora_openarm_evaluation_rust"
path = "src/lib.rs"

[[bin]]
name = "dora-openarm-evaluation-local-policy-server"
path = "src/bin/local_policy_server.rs"

[[bin]]
name = "dora-openarm-evaluation-docker-policy-server"
path = "src/bin/docker_policy_server.rs"

[dependencies]
# Pinned to the Arrow version that dora-node-api 0.5.0 depends on, so that
# ArrayRef values cross the boundary of a shared dataflow as the same type
# as the sibling dora-openarm-*-policy-server-rust node crates.
arrow = "=54.2.1"
arrow-ipc = "=54.2.1"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
