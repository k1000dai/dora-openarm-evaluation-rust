#
# Rust port of upstream's dataflow-cell-sample.yaml. Node ids, inputs,
# and outputs are unchanged -- dora dataflow wiring is language-agnostic,
# so only `build:`/`path:` differ from upstream, and only for the six
# node kinds that have a published `-rust` port. `build:` assumes this
# repository is checked out as a sibling of the node crates it
# references (the layout this port was developed in); adjust
# `--manifest-path` if yours differs.
#
# NOT ported, and deliberately left as upstream Python here:
# - `dora-openarm` (arm-right/arm-left): blocked on the unpublished,
#   closed-source `openarm-driver` native library (see MIGRATION_MATRIX
#   row 20).
# - `opencv-video-capture`, `dora-opencv-image-splitter`: third-party /
#   not in scope for this repository.
# - `openarm_cell_higher_pd.yaml`, referenced by arm-right/arm-left's
#   `args:`, is a file upstream's own dataflow references but does not
#   ship (see MIGRATION_MATRIX row 26); this port does not fabricate it.

nodes:
  # ---- Session UI ----
  - id: evaluation-ui
    build: cargo build --release --manifest-path ../dora-openarm-evaluation-ui-rust/Cargo.toml
    path: dora-openarm-evaluation-ui
    env:
      DATASET_DIR: "test/dataset"
      METADATA_FILE: "metadata.yaml"
      CHECKPOINT_PATH: "/path/to/checkpoints/<run-name>/<step>"
      AUTO_OPEN: "yes"
      PORT: "8000"
    inputs:
      tick: dora/timer/secs/1
      arm_status_right: arm-right/status
      arm_status_left: arm-left/status
      camera_wrist_right: camera-wrist-right/image
      camera_wrist_left: camera-wrist-left/image
      camera_head_left: camera-head-stereo-splitter/image_0
      camera_head_right: camera-head-stereo-splitter/image_1
      camera_ceiling: camera-ceiling/image
    outputs:
      - arm_command # start / stop / quit  — for arms, quitters, observer
      - task_prompt # current task language instruction

  # ---- Quittable tick sources ----
  - id: quittable-tick-arm
    build: cargo build --release --manifest-path ../dora-openarm-quitter-rust/Cargo.toml
    path: dora-openarm-quitter
    inputs:
      command: evaluation-ui/arm_command
      tick: dora/timer/millis/4 # 250 Hz
    outputs:
      - tick

  - id: quittable-tick-camera
    build: cargo build --release --manifest-path ../dora-openarm-quitter-rust/Cargo.toml
    path: dora-openarm-quitter
    inputs:
      command: evaluation-ui/arm_command
      tick: dora/timer/millis/33 # ~30 fps
    outputs:
      - tick

  - id: quittable-tick-observer
    build: cargo build --release --manifest-path ../dora-openarm-quitter-rust/Cargo.toml
    path: dora-openarm-quitter
    inputs:
      command: evaluation-ui/arm_command
      tick: dora/timer/millis/33 # ~30 Hz
    outputs:
      - tick

  # ---- Arms (not ported -- see header) ----
  - id: arm-right
    build: pip install -e nodes/dora-openarm
    path: dora-openarm
    args: "--side right --align-threshold 0.2 --config ./openarm_cell_higher_pd.yaml"
    inputs:
      request_position: quittable-tick-arm/tick
      request_state: quittable-tick-arm/tick
      move_position: actions-executor/move_position_right
      command: evaluation-ui/arm_command
    outputs:
      - position
      - state
      - status

  - id: arm-left
    build: pip install -e nodes/dora-openarm
    path: dora-openarm
    args: "--side left --align-threshold 0.2 --config ./openarm_cell_higher_pd.yaml"
    inputs:
      request_position: quittable-tick-arm/tick
      request_state: quittable-tick-arm/tick
      move_position: actions-executor/move_position_left
      command: evaluation-ui/arm_command
    outputs:
      - position
      - state
      - status

  # ---- Cameras (not ported -- see header) ----
  - id: camera-wrist-right
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/camera_wrist_right"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-wrist-left
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/camera_wrist_left"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-head-stereo
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/camera_head_stereo"
      ENCODING: "bgr8"
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-head-stereo-splitter
    build: pip install -e nodes/dora-opencv-image-splitter
    path: dora-opencv-image-splitter
    env:
      SPLIT_MODE: "vertical"
      NUM_SPLITS: 2
      JPEG_QUALITY: 90
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: quittable-tick-camera/tick
      image: camera-head-stereo/image
    outputs:
      - image_0
      - image_1

  - id: camera-ceiling
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/camera_ceiling"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  # ---- Observer: bundles arms + cameras + task_prompt into one observation ----
  - id: observer
    build: cargo build --release --manifest-path ../dora-openarm-observer-rust/Cargo.toml
    path: dora-openarm-observer
    inputs:
      tick: quittable-tick-observer/tick
      arm_right: arm-right/position
      arm_left: arm-left/position
      camera_wrist_right: camera-wrist-right/image
      camera_wrist_left: camera-wrist-left/image
      camera_head_left: camera-head-stereo-splitter/image_0
      camera_head_right: camera-head-stereo-splitter/image_1
      camera_ceiling: camera-ceiling/image

      command: evaluation-ui/arm_command
      arm_right_status: arm-right/status
      arm_left_status: arm-left/status
      task_prompt: evaluation-ui/task_prompt
    outputs:
      - observation

  - id: quittable-observer
    build: cargo build --release --manifest-path ../dora-openarm-quitter-rust/Cargo.toml
    path: dora-openarm-quitter
    inputs:
      command: evaluation-ui/arm_command
      observation: observer/observation
    outputs:
      - observation

  # ---- Policy server: dora node side (transport shim, ported) ----
  # The process behind this node's socket -- the one that actually runs
  # inference -- is `dora-openarm-evaluation-local-policy-server` from
  # this repository (or upstream's `src/local_policy_server.py` for real
  # LeRobot inference; see this repository's README, "The LeRobot
  # boundary"). It is started separately, before `dora run`, matching
  # upstream's two-terminal instructions.
  - id: policy-server
    build: cargo build --release --manifest-path ../dora-openarm-local-policy-server-rust/Cargo.toml
    path: dora-openarm-local-policy-server
    env:
      SOCKET: "/dev/shm/policy-server.socket"
    inputs:
      observation: quittable-observer/observation
    outputs:
      - actions

  # ---- Actions executor ----
  - id: actions-executor
    build: cargo build --release --manifest-path ../dora-openarm-actions-executor-rust/Cargo.toml
    path: dora-openarm-actions-executor
    args: "--upsample --filter --control-hz 250"
    inputs:
      actions: policy-server/actions
    outputs:
      - move_position_right
      - move_position_left
