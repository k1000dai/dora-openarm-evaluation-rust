#
# Rust port of upstream's dataflow-local-inference.yaml. Node ids,
# inputs, and outputs are unchanged; only `build:`/`path:` are remapped,
# and only for node kinds with a published `-rust` port. `build:` paths
# assume this repository is checked out as a sibling of the node crates
# it references; adjust `--manifest-path` if yours differs.
#
# `dora-openarm-mujoco` (which stands in here for both followers and all
# five cameras) is NOT ported: MuJoCo's Python viewer/renderer
# convenience layer has no Rust equivalent (see MIGRATION_MATRIX row 24).
# It is left as upstream Python.
#
# Before `dora run`, start the policy server this dataflow's
# `policy-server` node connects to:
# `cargo run --release --bin dora-openarm-evaluation-local-policy-server`
# from this repository -- **not** LeRobot ACT inference; see this
# repository's README, "The LeRobot boundary".

nodes:
  # --- observer: collects arms + cameras into one Arrow IPC bundle ---
  - id: observer
    build: cargo build --release --manifest-path ../dora-openarm-observer-rust/Cargo.toml
    path: dora-openarm-observer
    args: "--arms mujoco"
    inputs:
      tick: quittable-tick-observer/tick # 30 Hz gate
      arm_right: mujoco-collect/arm_right_observation
      arm_left: mujoco-collect/arm_left_observation
      camera_wrist_right: mujoco-collect/camera_wrist_right
      camera_wrist_left: mujoco-collect/camera_wrist_left
      camera_head_left: mujoco-collect/camera_head_left
      camera_head_right: mujoco-collect/camera_head_right
      camera_ceiling: mujoco-collect/camera_ceiling
      command: mujoco-collect/status # "ready" on startup opens the observer gate
    outputs:
      - observation # Arrow IPC file path + metadata, written to /dev/shm

  - id: quittable-tick-observer
    build: cargo build --release --manifest-path ../dora-openarm-quitter-rust/Cargo.toml
    path: dora-openarm-quitter
    inputs:
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - tick

  # --- quittable-observer: gate controlled by controller ---
  - id: quittable-observer
    build: cargo build --release --manifest-path ../dora-openarm-quitter-rust/Cargo.toml
    path: dora-openarm-quitter
    inputs:
      observation: observer/observation
    outputs:
      - observation

  # --- policy-server: dora node side (transport shim, ported) ---
  - id: policy-server
    build: cargo build --release --manifest-path ../dora-openarm-local-policy-server-rust/Cargo.toml
    path: dora-openarm-local-policy-server
    env:
      SOCKET: /dev/shm/policy-server.socket # must match your running server
    inputs:
      observation: quittable-observer/observation
    outputs:
      - actions # JSON: {interval, cutoff_hz, positions: [[16D], ...]}

  # --- actions-executor: unpacks the chunk and drives the arms ---
  - id: actions-executor
    build: cargo build --release --manifest-path ../dora-openarm-actions-executor-rust/Cargo.toml
    path: dora-openarm-actions-executor
    args: "--upsample --filter"
    inputs:
      actions: policy-server/actions
    outputs:
      - move_position_right # → arm-right
      - move_position_left # → arm-left

  # ── MuJoCo viewer (not ported -- see header) ──
  - id: mujoco-collect
    build: pip install -e nodes/dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--scene demo --keyframe home --enable-collision --ctrl --viewer --render"
    inputs:
      position_left: actions-executor/move_position_left
      position_right: actions-executor/move_position_right
    outputs:
      - status
      - arm_right_observation
      - arm_left_observation
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
